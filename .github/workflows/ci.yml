name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: PHP tests
        run: php artisan test

      - name: JavaScript tests
        run: |
          set -e
          found=0
          for testfile in tests/Js/*.test.mjs; do
            if [ -f "$testfile" ]; then
              found=1
              node --test "$testfile"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No JavaScript tests found."
          fi
