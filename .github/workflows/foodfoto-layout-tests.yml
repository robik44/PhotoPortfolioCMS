name: FoodFoto homepage layout tests

on:
  push:
    branches: [main]
    paths:
      - 'app/Console/Commands/FoodfotoHomeLayout.php'
      - 'tests/Feature/FoodfotoHomeLayoutTest.php'
      - '.github/workflows/foodfoto-layout-tests.yml'
  workflow_dispatch:

jobs:
  homepage-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Verify homepage layout safety
        run: php artisan test --filter=FoodfotoHomeLayoutTest
